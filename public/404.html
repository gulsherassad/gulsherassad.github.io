<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Gulsher Assad</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F4F2EE" />
    <link rel="icon" href="/portfolio/favicon.svg" type="image/svg+xml" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 100vh;
        min-height: 100svh;
        padding: clamp(20px, 5vw, 64px);
        padding-bottom: clamp(64px, 12vh, 128px);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #141414;
        background-color: #f4f2ee;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 1112px;
        margin-inline: auto;
      }

      .code {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 14px;
        color: #6b6862;
      }

      h1 {
        margin-top: 24px;
        font-family:
          ui-serif, 'New York', Georgia, Cambria, 'Times New Roman', Times,
          serif;
        font-size: clamp(48px, 1.591rem + 6.01vw, 104px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      a {
        display: inline-block;
        margin-top: 48px;
        font-size: 17px;
        color: inherit;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.25em;
        transition: color 200ms;
      }

      a:hover {
        color: #c4381a;
      }

      a:focus-visible {
        outline: 2px solid #e5461f;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page doesn’t exist.</h1>
      <a href="/portfolio/">← Back to the portfolio</a>
    </main>
  </body>
</html>
